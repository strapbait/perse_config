// crouch jump
alias "+duckjump" "+jump; +duck"
alias "-duckjump" "-duck; -jump"

// steps through no hud, no viewmodel, no hud + no view model, and back to normal
alias "hud_stepper" "sv_cheats 1; hud1"
alias "hud1" "r_drawviewmodel 0; cl_drawhud 1; tf_use_match_hud 0; alias hud_stepper hud2"
alias "hud2" "r_drawviewmodel 1; cl_drawhud 0; tf_use_match_hud 0; alias hud_stepper hud3"
alias "hud3" "r_drawviewmodel 0; cl_drawhud 0; alias hud_stepper hud4"
alias "hud4" "r_drawviewmodel 1; cl_drawhud 1; tf_use_match_hud 1; alias hud_stepper hud1"

echo aliases.cfg executed