// crouch jump
alias "+duckjump" "+jump; +duck"
alias "-duckjump" "-duck; -jump"

// jump hud aliases
alias "console_unlog" "con_logfile console.log"
alias "write_file_ammo" "con_logfile cfg\flawhud\hud_ammo_style.txt"
alias "clear_file_ammo" "sixense_clear_bindings; sixense_write_bindings flawhud\hud_ammo_style.txt"
alias "jumphud_ammo_enable" "clear_file_ammo; write_file_ammo; echo #base; echo ../../custom/flawhud/resource/ui/hudammoweapons_hide.res; console_unlog"
alias "jumphud_ammo_disable" "clear_file_ammo; write_file_ammo; echo #base; echo ../../custom/flawhud/resource/ui/hudammoweapons_base.res; console_unlog"

alias "write_file_health" "con_logfile cfg\flawhud\hud_health_style.txt"
alias "clear_file_health" "sixense_clear_bindings; sixense_write_bindings flawhud\hud_health_style.txt"
alias "jumphud_health_enable" "clear_file_health; write_file_health; echo #base; echo ../../custom/flawhud/resource/ui/hudplayerhealth_hide.res; console_unlog"
alias "jumphud_health_disable" "clear_file_health; write_file_health; echo #base; echo ../../custom/flawhud/resource/ui/hudplayerhealth_base.res; console_unlog"

alias "write_file_killstreak" "con_logfile cfg\flawhud\hud_killstreak_style.txt"
alias "clear_file_killstreak" "sixense_clear_bindings; sixense_write_bindings flawhud\hud_killstreak_style.txt"
alias "jumphud_killstreak_enable" "clear_file_killstreak; write_file_killstreak; echo #base; echo ../../custom/flawhud/resource/ui/huditemeffectmeter_killstreak_hide.res; console_unlog"
alias "jumphud_killstreak_disable" "clear_file_killstreak; write_file_killstreak; echo #base; echo ../../custom/flawhud/resource/ui/huditemeffectmeter_killstreak_base.res; console_unlog"

alias "write_file_objective" "con_logfile cfg\flawhud\hud_layout.txt"
alias "clear_file_objective" "sixense_clear_bindings; sixense_write_bindings flawhud\hud_layout.txt"
alias "jumphud_objective_enable" "clear_file_objective; write_file_objective; echo #base; echo ../../custom/flawhud/scripts/hudlayout_hideobjective.res; console_unlog"
alias "jumphud_objective_disable" "clear_file_objective; write_file_objective; echo #base; echo ../../custom/flawhud/scripts/hudlayout_base.res; console_unlog"

alias "jump_misc_enable" "sm_speedo 1; sm_speedorainbow; sm_speedo_xoff -1; sm_speedo_yoff 0.52; tf_use_match_hud 0; r_drawviewmodel 0"
alias "jump_misc_disable" "sm_speedo 0; tf_use_match_hud 1; r_drawviewmodel 1"

alias "jumphud_toggle" "jumphud_enable"
alias "jumphud_enable" "jumphud_health_enable; jumphud_ammo_enable; jumphud_killstreak_enable; jump_misc_enable; jumphud_objective_enable; hud_reloadscheme; alias jumphud_toggle jumphud_disable"
alias "jumphud_disable" "jumphud_health_disable; jumphud_ammo_disable; jumphud_killstreak_disable; jumphud_objective_disable; jump_misc_disable; hud_reloadscheme; alias jumphud_toggle jumphud_enable"

echo aliases.cfg executed